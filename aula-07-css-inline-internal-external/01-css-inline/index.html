<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>
<body>
    <h1>Demonstração de CSS Inline </h1>
    <p style="color: blue; font-size: 18px;">Este parágrafo utiliza CSS Inline através do atributo style.</p>

    <p
    style="color: red;
    font-weight: bold;
    background-color: yellow;"
    >Outro parágrafo com múltiplas propriedades CSS Inline.
    </p>
    <!-- padding: espaçamento interno / margin: espaçamento externo -->
    <div style="border: 2px solid rgb(0, 255, 0); width: 400px; padding: 30px; margin: 50px;">
           Esta é uma div estilizada com CSS Inline.
    </div>

    <h2 style="color: rgb(132, 0, 209); text-align: center;">
        Título centralizado com cor hexadecimal
    </h2>

    <div style="width: 600px; height: 400px; background-color: rgb(255, 115, 0); color: white; font-size: 32px; text-align: center;">
        Desafio realizado com sucesso!
    </div>
</body>
</html>
