<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1>Tabelas no HTML5:</h1>
    <table border="1">
          <tr>
             <td>Dado 1</td>
             <td>Dado 2</td>
             <td>Dado 3</td>
          </tr>
          <tr>
             <td>Dado 4</td>
             <td>Dado 5</td>
             <td>Dado 6</td>
          </tr>
        <table border="1">
         <caption>Vendas do mês</caption>

          
          <head>
             <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor</th>
             </tr>
          </head>
       <tbody>
           <tr>
              <td rowspan="2">Mouse</td>
              <td>10</td>
              <td>R$ 500,00</td>
           </tr>

           <tr>
              <td>Mouse</td>
              <td>20</td>
              <td>R$ 1.000,00</td>
            </tr>
/body>
</html>
